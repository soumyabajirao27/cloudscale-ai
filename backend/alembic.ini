[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Makes the backend directory importable so `app.*` packages resolve.
prepend_sys_path = .

# The database URL is intentionally NOT set here.
# It is loaded from app.core.config.settings in alembic/env.py
# (single source of truth: backend/.env).
# sqlalchemy.url =

# Logging configuration (stdout/stderr console handler).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

